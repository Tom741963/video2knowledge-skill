[project]
name = "video2knowledge-skill"
version = "0.2.0"
description = "Turn videos and files into timestamped, searchable knowledge packs for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=5.0.0", "python-docx>=1.1.0", "python-pptx>=0.6.23", "openpyxl>=3.1.0"]
retrieval = ["scikit-learn>=1.4", "joblib>=1.3"]
video = ["faster-whisper>=1.1.0", "av<19"]
mcp = ["mcp>=2.0,<3; python_version >= '3.11'"]
all = ["pypdf>=5.0.0", "python-docx>=1.1.0", "python-pptx>=0.6.23", "openpyxl>=3.1.0", "faster-whisper>=1.1.0", "av<19", "scikit-learn>=1.4", "joblib>=1.3", "mcp>=2.0,<3; python_version >= '3.11'"]

[project.scripts]
video2knowledge = "video2knowledge.cli:main"
video2knowledge-mcp = "video2knowledge.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]


