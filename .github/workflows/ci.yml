name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and retrieval dependencies
        run: python -m pip install -e ".[retrieval]"

      - name: Validate JSON tool contract
        run: python -m json.tool tools.json > /dev/null

      - name: Validate Skill frontmatter
        run: >-
          python -c "from pathlib import Path; t=Path('SKILL.md').read_text(encoding='utf-8');
          assert t.startswith('---\\nname: video2knowledge\\ndescription: ');
          assert '\\n---\\n' in t[:1000]"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
